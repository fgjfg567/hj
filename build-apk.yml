name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [ debug, release, both ]
        default: both

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type != 'release'
        run: gradle assembleDebug --stacktrace

      - name: Build release APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type != 'debug'
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PriceCompare-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
